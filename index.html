<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맑은마을 이야기 – SDG 6 미연시</title>
<style>
:root{color-scheme:dark;--bg:#0b1d33;--pn:#12304f;--ac:#5cc8ff;--tx:#eaf6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif}
#app{max-width:720px;height:100%;margin:auto;position:relative;display:flex;flex-direction:column;background:linear-gradient(#173f66,#0b1d33 70%)}
#stage{flex:1;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;min-height:0}
#p svg{height:min(52vh,420px);display:block}
#box{margin:8px;padding:12px 14px;background:rgba(10,30,52,.92);border:2px solid var(--ac);border-radius:14px;min-height:110px;cursor:pointer}
#nm{color:var(--ac);font-weight:700;margin-bottom:4px}#tx{line-height:1.6}
#ch{position:absolute;left:0;right:0;bottom:130px;display:flex;flex-direction:column;gap:8px;padding:0 14px}
button,.card{font:inherit;color:var(--tx);background:var(--pn);border:2px solid var(--ac);border-radius:12px;padding:10px;cursor:pointer}
button:hover{background:#1d5083}button:disabled{opacity:.4}
#ov{position:absolute;inset:0;background:rgba(8,20,36,.96);overflow:auto;padding:16px;box-sizing:border-box;display:none}
h1{margin:6px 0;font-size:24px;color:var(--ac)}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{text-align:center;font-size:13px}.card svg{height:90px}
input{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--ac);background:#0b1d33;color:var(--tx)}
#p img{height:min(52vh,420px);max-width:100%;object-fit:contain;background:#fff;border-radius:14px 14px 0 0}.card img{height:90px;border-radius:8px}.gp{background:rgba(10,30,52,.96);border:2px solid var(--ac);border-radius:14px;padding:12px;text-align:center}.bar{position:relative;height:22px;background:#0b1d33;border:2px solid var(--ac);border-radius:11px;margin:10px 0;overflow:hidden}.zn{position:absolute;left:43%;width:14%;top:0;bottom:0;background:#2ecc71}.mk{position:absolute;top:0;bottom:0;width:6px;background:#ff6b9a}.fl{height:100%;background:#ff6b9a;width:0}.arena{position:relative;height:130px;background:#0b1d33;border-radius:10px;margin:8px 0;overflow:hidden}.hb{position:absolute;font-size:26px;padding:2px 6px}.big{font-size:56px;height:70px}#gk{display:flex;gap:8px;justify-content:center}#mv{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 1.5s;overflow:hidden}#cv{position:absolute;inset:0;pointer-events:none}#mi{position:relative;display:flex;justify-content:center;align-items:center;font-size:80px;min-height:40vh}#mi img{height:min(40vh,300px);max-width:18vw;object-fit:contain;border-radius:14px;margin:0 6px;animation:zm 5s linear forwards}@keyframes zm{from{transform:scale(1)}to{transform:scale(1.12)}}#mc{position:relative;font-size:22px;font-weight:700;text-align:center;white-space:pre-line;padding:0 16px;transition:opacity 1s;text-shadow:0 2px 8px #000;margin-top:14px}.rg{animation:pl 1s ease-in-out infinite alternate}@keyframes pl{to{transform:scale(1.3)}}#sk{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:2}</style></head><body>
<div id="app"><div id="stage"><div id="p"></div></div><div id="ch"></div>
<div id="box"><div id="nm"></div><div id="tx"></div></div><div id="ov"></div></div>
<script>
const H=[
{n:'아라',job:'수질 분석 연구원',age:26,hc:'#cfd8f0',ec:'#6aa0e8',cl:'#2d4f9c',ac:'#e8eefc',long:1,x:'<path d="M60 52l-24-10v26zM60 52l22-10v26z" fill="#1c2a6b"/><path d="M140 60Q158 120 150 200" stroke="#2a54e0" stroke-width="8" fill="none"/>'},
{n:'서윤',job:'탐사 기자',age:27,hc:'#1b1b22',ec:'#2a2a33',cl:'#33333c',ac:'#555',long:1,sm:1,x:'<path d="M56 96Q100 40 144 96" stroke="#fff" stroke-width="5" fill="none"/>'},
{n:'하니',job:'물안전 구조대원',age:25,hc:'#a8e6b0',ec:'#2fb8a0',cl:'#f4f7f7',ac:'#1c2a3a',long:0,x:'<path d="M28 260Q30 200 62 190L62 260Z" fill="#18b8a0"/><rect x="126" y="62" width="16" height="6" fill="#18b8a0" transform="rotate(30 134 65)"/>'},
{n:'미루',job:'수자원 지질학자',age:28,hc:'#4a5bd6',ec:'#8aa0ff',cl:'#8a5a2b',ac:'#3a2410',long:0,x:'<path d="M150 120Q172 190 150 250" stroke="#4a5bd6" stroke-width="16" fill="none"/><ellipse cx="100" cy="56" rx="72" ry="13" fill="#1d1d26"/><path d="M62 56Q100 -12 138 56Z" fill="#1d1d26"/>'},
{n:'하린',job:'위생 교육 활동가',age:24,hc:'#2a2e3d',ec:'#5a6a9a',cl:'#22252e',ac:'#22252e',long:0,bl:1,x:'<path d="M78 190L100 218L122 190" stroke="#fff" fill="none" stroke-width="5"/><circle cx="72" cy="134" r="3" fill="#8cd0ff"/>'}];
const E=[[
['채수병은 이렇게 헹군 뒤에 담아요. 오늘 샘플은 마을 공동 우물물이에요.','수질 검사는 대장균군부터 봐요. 분변 오염을 알려 주는 신호거든요.','…처음인데 손이 정확하시네요. 조금 놀랐어요.','그럼 질문이에요. 물이 투명하면 마셔도 안전할까요?',['투명하면 안전하다','아니요, 세균·화학물질은 눈에 안 보일 수 있다','냄새만 없으면 안전하다'],1,'맑아 보여도 병원성 세균과 중금속은 검사로만 알 수 있어요. (6.1 안전한 식수)'],
['오늘은 정수장 견학이에요. 응집, 침전, 여과, 소독 순서로 물이 깨끗해져요.','저는 이 조용한 기계음이 좋아요. 모르는 새 안전을 만들어 주는 소리라서요.','저기, 소매에 물 묻었어요. 제가 닦아… 아, 가깝네요.','문제예요. 정수장에서 마지막에 소독하는 이유는?',['병원성 미생물을 없애려고','물맛을 달게 하려고','물을 차갑게 하려고'],0,'염소 등으로 소독해야 배관을 지나는 동안에도 미생물 증식을 막아요.'],
['센터 옥상이에요. 여기서 보는 마을 야경, 제가 제일 좋아하는 곳이에요.','아직 20억 명이 넘는 사람이 안전하게 관리되는 식수를 못 써요. 숫자로 보면 막막하죠.','그래도 당신과 함께라면 해낼 수 있을 것 같아요. ','식수가 부족한 지역에 가장 필요한 것은?',['고급 생수를 한 번 나눠 주기','지속 가능한 상수도·우물 설치와 관리','빗물을 방치하기'],1,'한 번의 지원보다 시설을 만들고 오래 유지하는 체계가 중요해요. (6.1, 6.a)']],
[
['어, 신입? 마침 잘 왔다. 하류 강물이 자꾸 이상해서 취재 중이거든.','거품에다 이상한 냄새… 누가 몰래 흘려보내는 것 같아. 같이 가 볼래?','넌 카메라만 들어. 질문 하나 줄게. 공장 폐수를 그대로 강에 버리면?',['수질 오염으로 생태계와 식수원이 위협받는다','흐르니까 저절로 사라진다','물고기가 늘어난다'],0,'오염물질은 사라지는 게 아니라 하류로 옮겨 가요. (6.3 수질 개선)'],
['하수처리장 잠입… 아니, 정식 취재야! 허가증 있어.','여기서 오염물질을 걸러야 우리가 쓴 물이 강으로 돌아가도 안전하거든.','자, 퀴즈. 하수 처리의 핵심 목적은?',['냄새만 가리기','오염물질을 줄여 안전하게 방류·재사용하기','물의 양 늘리기'],1,'미처리 하수는 수인성 질병과 하천 오염의 주범이에요. (6.2, 6.3)'],
['드디어 폐수 불법 배출 건이 보도됐어. 네 사진 덕분이야.','사실 난 늘 혼자 취재했거든. 근데 네가 옆에 있으니까 든든하더라. …농담 아니야.','마지막 문제! 처리한 물을 청소·농업용수로 재이용하면?',['물 낭비가 늘어난다','물 부족 완화와 이용 효율 향상에 도움이 된다','불법이다'],1,'폐수 재이용은 물 부족 시대의 핵심 전략이에요. (6.3, 6.4)']],
[
['신입 발견! 저는 물안전 구조대 하니예요. 잘 부탁해요!','어제 폭우로 마을 아래쪽 우물이 침수됐어요. 같이 점검하러 가요!','미끄러우니까 제 손 잡아요! 퀴즈! 홍수 뒤 침수된 우물물은?',['그대로 마셔도 된다','끓이거나 소독 전엔 마시지 않는다','물이 많으니 괜찮다'],1,'홍수 후 우물은 오염 가능성이 커서 검사와 소독이 먼저예요. (6.1)'],
['오늘은 구명 훈련! 물은 즐거운 곳이지만 안전이 먼저예요.','정전이나 단수가 오면, 식수 확보가 제일 급해져요.','어라, 얼굴 빨개졌어요? 햇볕 때문이죠?! 문제요! 비상시 식수는?',['강물 그대로','끓이거나 정수 알약·필터 사용','바닷물'],1,'끓이기, 염소 소독, 필터 등으로 처리해야 안전해요.'],
['오늘은 비가 엄청 와요. 그래도 비상 물탱크가 든든하죠!','솔직히 저, 구조할 때보다 당신 앞에서 더 심장이 뛰어요. …으아, 못 들은 걸로 해요!','마지막 문제! 재난 대비에서 물 관리가 중요한 이유는?',['극한 홍수·가뭄 때 식수·위생이 무너지기 쉬워서','재미있어서','상관없다'],0,'기후 재난은 물 시설을 가장 먼저 위협해요. (6.5 통합 물관리)']],
[
['…조사 가방은 내가 들겠다. 마을 뒷산 지하수 관측정으로 간다.','나는 지층과 물길을 연구해. 겉보기와 달리 연상이니까 말은 편하게 해도 된다.','수위가 해마다 내려가고 있어. 질문. 지하수를 필요 이상 퍼 올리면?',['물이 무한히 생긴다','고갈·지반 침하·염수 침투 위험이 있다','수질이 좋아진다'],1,'재생되는 속도 이상으로 쓰면 지속 불가능해요. (6.4)'],
['여기가 마을 위쪽 습지다. 그냥 진흙 같지만 물을 머금고 걸러 주는 보물이지.','멸종위기 생물이 사는 곳이기도 해. 물과 생명은 따로가 아니야.','…눈을 반짝이며 듣는구나. 문제다. 습지와 숲이 중요한 이유는?',['물을 저장·정화하는 자연 필터라서','장식이라서','모기 때문에'],0,'물 관련 생태계 보호·복원이 SDG 6.6이에요.'],
['유역 지도다. 상류부터 하류까지 하나의 물길이지.','한 마을만 노력해선 소용없어. 이웃 마을과도 손잡아야 해.','…너와는 계속 함께하고 싶어졌어. 마지막 문제. 유역 전체를 함께 관리하는 이유는?',['행정 편의','강 이름 통일','상류 오염과 사용량이 하류에 영향을 주기 때문'],2,'통합 수자원 관리는 국경과 행정구역을 넘어요. (6.5)']],
[
['아, 저기… 안녕하세요. 위생 교육 담당 하린이에요. 사람 앞에선 조금 떨려서…','오늘은 마을 초등학교 손 씻기 교실을 준비 중이에요. 도와주신다니… 눈물 나려고 해요, 죄송해요.','저, 질문 하나만… 올바른 손 씻기는?',['물만 살짝 묻힌다','비누로 20초 이상 문지른다','1~2초면 충분하다'],1,'비누와 흐르는 물로 충분히 씻는 것이 가장 값싼 감염병 예방법이에요. (6.2)'],
['이 마을엔 예전에 화장실 때문에 설사병이 번진 적이 있어요.','그래서 위생시설을 고치는 일에 마음이 쓰여요. 당신이 웃어 주면 용기가 나요.','질문이에요. 안전한 화장실·위생시설이 부족하면?',['수인성 질병 확산 위험이 커진다','영향이 없다','물이 더 맑아진다'],0,'위생시설 부족은 식수 오염과 질병으로 직결돼요. (6.2)'],
['오늘은 주민 회의에서 물 관리 계획을 발표하는 날이에요. 떨려요…','당신이 맨 앞줄에서 응원해 줄 거라고 생각하면, 울지 않고 할 수 있을 것 같아요.','마지막 질문이에요. 주민이 물 관리에 직접 참여하면?',['지속 가능성이 낮아진다','시설 유지·관리와 책임감이 높아진다','의미 없다'],1,'지역사회 참여는 물과 위생 관리의 지속 가능성을 높여요. (6.b)']]];
const X=[[["오늘은 강 상류 모니터링이에요. 센서가 pH, 탁도, 용존산소를 계속 재고 있어요.", "숫자가 조금만 어긋나도 물이 아프다는 신호예요. 그래서 전 매일 확인해요.", "…당신 심박수도 재어 볼까요? 농담이에요. 아마도요.", 0, 0, 0, "수질은 pH·탁도·용존산소 등 지표로 상시 감시해야 오염을 빨리 발견해요. (6.3)"], ["오늘은 수도관 점검이에요. 정수장을 나온 물도 낡은 관을 지나면 오염될 수 있어요.", "그래서 상수도는 만드는 것만큼 유지·보수가 중요해요.", "…같이 걸어 주셔서 고마워요. 점검 길이 이렇게 짧게 느껴진 건 처음이에요.", 0, 0, 0, "정수 후에도 노후 배관과 누수 관리가 안전한 수돗물을 지켜요. (6.1, 6.4)"], ["오늘은 다른 나라 연구자들과 화상회의가 있어요. 수질 분석 기술을 나누는 모임이에요.", "우리가 가진 기술이 다른 곳에서도 쓰일 수 있다는 게 좋아요.", "회의가 끝나면… 저녁을 같이 먹어요. 이건 업무가 아니에요.", 0, 0, 0, "기술과 경험의 국제 협력은 물 부족 지역의 역량을 키워 줘요. (6.a)"]], [["이번엔 마을 정화조 취재야. 관리 안 된 정화조가 지하수로 새는 경우가 많대.", "냄새 맡기 싫지만… 진실은 늘 구린 데 있거든. 같이 가 줄 거지?", "…고마워. 이런 데까지 따라와 주는 사람, 처음이야.", 0, 0, 0, "정화조·오수 시설을 주기적으로 점검해야 지하수 오염을 막아요. (6.2, 6.3)"], ["취재 자료는 투명하게 공개해야 해. 주민들이 직접 수질 데이터를 볼 수 있게 말이야.", "알면 감시도 하고, 참여도 하잖아. 그게 마을을 바꾸는 힘이지.", "…너한테만 말하는데, 네 얘기 쓰고 싶어졌어. 사랑 이야기로.", 0, 0, 0, "정보 공개와 주민 참여가 물 관리 거버넌스를 튼튼하게 해요. (6.b)"], ["오늘 칼럼 주제는 “싱크대에 버리는 것들”이야. 기름, 약, 페인트… 다 하수로 가거든.", "작은 습관 하나가 강을 살리는 거야. 거창할 필요 없어.", "자, 너도 오늘부터 실천하는 거다? 약속!", 0, 0, 0, "기름·약품을 하수구에 버리지 않는 가정의 작은 실천이 수질 오염을 줄여요. (6.3)"]], [["오늘은 우물 덮개 설치 작업이에요! 뚜껑 하나로 오염이 확 줄어요.", "빗물이랑 동물 배설물이 들어가는 걸 막아 주거든요. 같이 들어요, 하나 둘!", "…헉, 손이 겹쳤다. 나 지금 얼굴 새빨갛죠?!", 0, 0, 0, "우물을 덮고 주변을 위생적으로 관리하면 식수 오염을 크게 줄일 수 있어요. (6.1)"], ["가뭄이 길어지고 있어요. 비상 급수 순번표를 짜야 해요.", "물이 부족할 땐 필수 용도부터 먼저, 그리고 모두가 조금씩 아끼는 게 중요해요.", "저도 샤워 시간 줄였어요! …칭찬해 줄 거죠?", 0, 0, 0, "가뭄 땐 우선순위 배분과 절수가 필요해요. (6.4, 6.5)"], ["오늘은 빗물 저장탱크 만들기예요! 지붕에서 내려온 빗물을 모아 두는 거죠.", "청소나 텃밭 용수로 쓰면 수돗물을 아낄 수 있어요.", "다 만들면, 이 탱크 앞에서 같이 사진 찍어요. 기념으로요!", 0, 0, 0, "빗물 저장·이용은 물 이용 효율을 높이고 물 부족을 줄여요. (6.4)"]], [["오늘은 마을 밭 관개 점검이다. 물을 한꺼번에 쏟으면 대부분이 증발하거나 흘러가 버리지.", "점적 관개처럼 뿌리에 필요한 만큼만 주는 방식이 효율적이다.", "…너는 필요한 만큼이 아니라 늘 넘치게 다정하군. 곤란하다.", 0, 0, 0, "농업은 물 사용량이 커서 점적 관개 같은 효율적 방식이 중요해요. (6.4)"], ["오늘은 하천 복원 현장이다. 직선으로 깎인 물길에 다시 굽이를 만들어 준다.", "물가에 풀과 곤충, 물고기가 돌아오면 물도 스스로 맑아져.", "…네가 곁에 있으니 복원이라는 말이 다르게 들리는군.", 0, 0, 0, "하천과 습지 같은 물 생태계 복원은 수질 정화와 생물 다양성에 도움이 돼요. (6.6)"], ["가뭄이 오면 지하수가 마지막 보루다. 그래서 비가 올 때 땅에 물을 채워 두는 장치를 만들었지.", "인공 함양이라 부른다. 지금 아끼는 한 방울이 훗날 모두의 물이 된다.", "…이 일이 끝나도, 네 곁에서 같이 쌓아 가고 싶다.", 0, 0, 0, "지하수 함양과 지속 가능한 이용은 장기적 물 안보를 지켜요. (6.4, 6.5)"]], [["오늘은 여성 위생 교육이에요. 월경 위생도 안전한 물과 화장실이 있어야 지킬 수 있어요.", "부끄러워서 못 묻는 분이 많아서, 제가 먼저 편하게 말하려고 해요.", "…당신이 옆에 있으면 말이 술술 나와요. 신기하죠.", 0, 0, 0, "안전한 물과 위생시설은 특히 여성과 소녀의 건강·교육 기회와 연결돼요. (6.2)"], ["마을 공중화장실을 청소하는 날이에요. 짓는 것만큼 유지·관리가 중요하거든요.", "손 씻는 시설에 비누가 항상 있어야 사람들이 실제로 써요.", "같이 해 줘서 고마워요… 오늘은 울지 않았어요! 칭찬해 줘요.", 0, 0, 0, "위생시설은 짓는 데서 끝나지 않고 꾸준한 관리와 비누 공급이 필요해요. (6.2)"], ["오늘은 우리가 만든 물·위생 계획을 마을 학교 아이들에게 알려 주는 날이에요.", "아이들이 “손 씻을래요!” 하고 달려가는 모습을 보면 눈물이 나요.", "…이번엔 기쁜 눈물이에요. 당신 덕분이에요.", 0, 0, 0, "교육과 습관이 쌓이면 마을의 위생 수준이 오래 유지돼요. (6.2, 6.b)"]]];X.forEach((a,i)=>E[i].push(...a));
const W=[['당신 덕분에 샘플 말고 다른 것도 소중히 들여다보게 됐어요.','저와 결혼해 주세요. 맑은 물처럼 투명하게, 평생 곁에 있을게요.','결혼식 날, 하객들은 마을 우물물로 건배했다.'],
['특종은 많이 썼지만 이건 인생 최고의 기사야. 제목은 ‘나, 결혼합니다’.','평생 옆자리 취재, 허락해 줄 거지?','식장에서 서윤은 카메라 대신 당신의 손을 잡았다.'],
['구조대원은 소중한 사람을 절대 놓치지 않아요! 내 평생을 맡아 줘요!','물이 깊어도, 파도가 높아도 함께 헤엄칠게요!','결혼식 날 하니는 웃다가 울다가, 결국 둘 다 했다.'],
['수많은 지층을 봤지만, 너와 쌓은 시간이 제일 깊어.','…결혼하자. 앞으로의 물길도 함께 걷고 싶다.','미루의 모자 위에 신부의 꽃이 살짝 얹혔다.'],
['저, 울지 않으려고 했는데… 역시 안 되네요.','평생 손 잡고, 같이 씻고, 같이 웃어 주실래요? 결혼해 주세요.','식이 끝나자 하린은 처음으로 마을 사람들 앞에서 크게 웃었다.']];

const EV={0:['월요일 아침, 센터 게시판에 긴급 공지가 붙었다. “상류 취수원 탁도 상승 — 원인 조사 필요.”','마을 수돗물이 탁해지기 전에 원인을 찾아야 한다. 동료들과 함께라면 할 수 있을 것이다.'],3:['폭우 예보가 떴다. 상류의 오염물질이 비와 함께 흘러내릴지도 모른다.','센터 안의 공기가 팽팽해졌다. 이번 위기를 누구와 헤쳐 나갈까?'],6:['셋째 주가 시작됐다. 조사 결과, 상류 공장 폐수와 낡은 정화조가 오염의 원인이었다.','주민들은 불안해했지만, 센터 사람들은 밤새 정수 설비를 점검하고 있었다.'],9:['마지막 주가 시작됐다. 주민 설명회가 사흘 앞으로 다가왔다.','센터 사람들의 눈 밑에 다크서클이 생겼지만, 아무도 포기하지 않았다.'],11:['마지막 날, 주민 설명회가 열린다. 오염은 막아냈고 수돗물은 다시 맑아졌다.','이제 마음을 전할 마지막 기회다. 누구에게 가야 할까?']};
const BS=[['…사실 어릴 때 오염된 우물물 때문에 아팠던 적이 있어요. 그래서 물을 연구하게 됐죠.','그날 이후, 안전한 물은 누군가의 평범한 일상을 지키는 일이라고 믿어요.'],['기자가 된 이유? 어릴 적 우리 동네 강이 죽어 가는데 아무도 이유를 안 알려 줬거든.','그래서 난 끝까지 파헤쳐. 진실이 맑아야 물도 맑아지니까.'],['저, 어릴 때 물에 빠진 적이 있어요. 그때 누군가가 저를 건져 줬어요.','그 사람처럼 되고 싶어서 구조대원이 됐어요. 물은 무섭지만 사랑스러워요!'],['나는 우물 하나 때문에 마을이 갈라지는 걸 본 적이 있다.','물은 나누면 풍요가 되고, 독점하면 다툼이 되지. 그래서 통합 관리를 믿는다.'],['저는 어릴 때 손 씻는 법을 몰라 자주 아팠어요. 가르쳐 준 선생님이 평생 은인이에요.','이번엔 제가 누군가의 선생님이 되고 싶어요. 눈물이 많아도, 괜찮죠?']];
const R=[['…두근거렸어요. 물소리보다 심장 소리가 더 크게 들려요.','괜찮아요, 다음엔 더 잘할 수 있어요.'],['오, 제법인데? 방금 취재수첩에 적을 뻔했어.','어이쿠, 아쉽다. 근데 그것도 귀엽네.'],['해냈다! 하이파이브… 아, 손이 너무 가까웠나요?!','아앗, 놓쳤어요! 괜찮아요, 다음엔 꼭!'],['…나쁘지 않군. 네 호흡이 마음에 들어.','…다음에 다시 하자. 서두를 필요는 없어.'],['저, 저도 모르게 웃어 버렸어요… 헤헤.','으으, 죄송해요… 그래도 같이 해서 즐거웠어요.']];
function play(st,done){let i=0;$('ov').style.display='none';(function nx(){$('ch').innerHTML='';if(i>=st.length)return done();const s=st[i++];$('p').innerHTML=s.h>=0?pt(s.h):'';$('nm').textContent=s.h>=0?H[s.h].n:s.h==-2?S.n:'';$('tx').textContent=s.t;$('box').onclick=nx;
if(s.g!==undefined){$('box').onclick=null;game(s.g,ok=>{if(ok)S.a[s.h]+=2;st.splice(i,0,{h:-1,t:ok?'💗 마음이 통했다! (호감도 +2)':'…살짝 어긋났다. (호감도 +0)'},{h:s.h,t:R[s.h][ok?0:1]});nx()})}})()}
function game(g,cb){let T,F,done=0;const gp=document.createElement('div');gp.className='gp';$('ch').appendChild(gp);const fin=ok=>{if(done)return;done=1;clearInterval(T);cancelAnimationFrame(F);gp.remove();cb(ok)};

function menu(){if(EV[S.t]&&!S.e[S.t]){S.e[S.t]=1;return play(EV[S.t].map(t=>({h:-1,t})),menu)}const w=Math.floor(S.t/3)+1,n=S.t%3+1;let h=`<h1>${w}주차 · ${n}번째 만남</h1><p>누구를 만나러 갈까요? (호감도 ♥ 표시)</p><div class="g">`;
H.forEach((c,i)=>{h+=`<div class="card" ${S.m[i]<6?`onclick="meet(${i})"`:'style="opacity:.4"'}>${pt(i)}<br><b>${c.n}</b> (${c.age}) ${c.job}<br>♥ ${S.a[i]} · 만남 ${S.m[i]}/6</div>`});scr(h+'</div><p><button onclick="end()">💍 바로 결혼하기</button></p>')}
function meet(h){S.snap=JSON.stringify({a:S.a,m:S.m,t:S.t,l:S.l,e:S.e});const e=E[h][S.m[h]],L=e.slice(0,e.length-4),g=(h+S.m[h])%7,I=['(눈이 마주쳤다. 심장 박동에 맞춰 타이밍을 잡자!)','(가슴이 마구 뛴다! 마음을 모아 연타하자!)','(반짝이는 마음 조각이 떠오른다! 놓치지 말고 잡자!)','(소중한 순간을 놓치지 말자. 순서를 외워서 눌러 보자!)','(숫자가 반짝인다! 1부터 차례대로 눌러 보자!)','(카드 속에 마음이 숨어 있다. 같은 그림을 찾아보자!)','(순간을 기다려라. 하트로 바뀌는 찰나에 눌러라!)'],st=L.map(t=>({h,t}));if(S.m[h]==1)BS[h].forEach(t=>st.push({h,t}));st.push({h,t:I[g],g});st.push({h:-1,t:'💧 SDG 6 TIP · '+e[e.length-1]});S.a[h]+=1;play(st,()=>{S.m[h]++;S.t++;S.l=h;S.t<12?menu():end()})}
function end(){let m=Math.max(...S.a),T=[];H.forEach((c,i)=>{if(S.a[i]==m)T.push(i)});if(m<6){if(S.t<12)return scr('<h1>💔 아직 부족해요</h1><p>결혼하려면 호감도 6 이상이 필요해요. (현재 최고 ♥'+m+')</p><button onclick="menu()">돌아가기</button>');return scr('<h1>🤝 친구 엔딩</h1><p>호감도 6 이상인 사람이 없었어요. 최고 호감도 ♥'+m+'</p><button onclick="redo()">↩ 다시 고르기</button> <button onclick="title()">다시 시작</button>')}scr('<h1>💍 프러포즈할 사람은?</h1><p>'+(T.length>1?'호감도 공동 1위! 모두와 결혼해요 💖':'호감도가 가장 높은 한 명에게만 프러포즈할 수 있어요.')+'</p><div class="g">'+H.map((c,i)=>{const t=T.includes(i);return `<div class="card" ${t?`onclick="end2([${T}])" style="border-color:#ff6b9a"`:'style="opacity:.35"'}>${pt(i)}<br><b>${c.n}</b> ♥ ${S.a[i]}${t?'<br>💍 호감도 1위 · 눌러서 프러포즈':''}</div>`}).join('')+'</div><p><button onclick="redo()">↩ 다시 고르기 (마지막 만남 취소)</button></p>')}
function redo(){if(!S.snap)return;Object.assign(S,JSON.parse(S.snap));menu()}
function end2(T){const nm=T.map(i=>H[i].n).join(', '),st=[{h:-1,t:'4주가 흘렀다. 맑은마을의 수도꼭지에서는 누구나 안심하고 마실 수 있는 물이 흘렀다.'}];
T.forEach(b=>{st.push({h:-1,t:'그리고 어느 저녁, '+H[b].n+'가 당신을 센터 앞 우물가로 불러냈다.'},...W[b].map((t,i)=>({h:i<2?b:-1,t})))});
st.push({h:-2,t:T.length>1?'…모두와 함께라면 어떤 물길도 두렵지 않아요! (💍 모두와 결혼 엔딩 · '+nm+')':'…네, 기꺼이! (💍 결혼 엔딩 · '+nm+')'});
if(T.length>1)st.push({h:-1,t:'하객석은 가득 찼고, 맑은마을 우물가에는 웃음소리가 끊이지 않았다.'});
st.push({h:-1,t:'SDG 6은 끝나지 않는다. 오늘도 누군가는 깨끗한 물을 기다린다. 물을 아끼고, 오염시키지 않고, 함께 지키는 것이 우리의 몫이다.'});
play(st,()=>movie(T))}
function endscr(T){const nm=T.map(i=>H[i].n).join(', ');scr(`<h1>💍 ${nm} 결혼 엔딩</h1><p>최종 호감도: ${H.map((c,i)=>c.n+' ♥'+S.a[i]).join(' / ')}</p><button onclick="movie([${T}])">🎬 엔딩 영상 다시 보기</button> <button onclick="redo()">↩ 다시 고르기</button> <button onclick="title()">다시 시작</button>`)}
function movie(T){const mv=document.createElement('div');mv.id='mv';mv.innerHTML='<canvas id="cv"></canvas><div id="mi"></div><div id="mc"></div><button id="sk">건너뛰기 ⏭</button>';document.body.appendChild(mv);
const cv=$('cv'),x=cv.getContext('2d');let W=cv.width=mv.clientWidth,Hh=cv.height=mv.clientHeight,mode=0,run=1,F,k=0,tm;
const P=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*Hh,v:1+Math.random()*2,s:3+Math.random()*5,a:Math.random()*6}));
const draw=()=>{x.clearRect(0,0,W,Hh);P.forEach(p=>{p.y+=p.v*(mode?.6:2.2);p.a+=.03;if(mode)p.x+=Math.sin(p.a)*1.2;if(p.y>Hh){p.y=-10;p.x=Math.random()*W}x.fillStyle=mode?'rgba(255,170,200,.85)':'rgba(120,200,255,.7)';x.beginPath();if(mode)x.ellipse(p.x,p.y,p.s,p.s/2,p.a,0,7);else x.arc(p.x,p.y,p.s/2,0,7);x.fill()});if(run)F=requestAnimationFrame(draw)};draw();
const im=T.map(i=>`<img src="${IMG[i]}">`).join('');
const sc=[['— 4주 뒤, 맑은마을 —','linear-gradient(#0b1d33,#1d4a73)',0,''],['수도꼭지에서는 누구나 마실 수 있는 맑은 물이 흘렀다.','linear-gradient(#1d4a73,#3f9fd6)',0,'💧'],['그리고 그날 저녁, 우물가에서 우리는 약속했다.','linear-gradient(#3f9fd6,#ffb48a)',0,im],['“평생, 이 물길을 함께 지키자.”','linear-gradient(#ffb48a,#ff8fb8)',1,im+'<div class="rg">💍</div>'],['🎊 결혼을 축하합니다 🎊','linear-gradient(#ff8fb8,#7a5cff)',1,im],['SDG 6\n모두를 위한 깨끗한 물과 위생\n— 맑은마을 이야기 · THE END —','#05101d',1,'💧']];
const fin=()=>{run=0;cancelAnimationFrame(F);clearTimeout(tm);mv.remove();endscr(T)};
const next=()=>{if(k>=sc.length)return fin();const s=sc[k++];mv.style.background=s[1];mode=s[2];$('mi').innerHTML=s[3];$('mc').style.opacity=0;setTimeout(()=>{if($('mc')){$('mc').textContent=s[0];$('mc').style.opacity=1}},500);tm=setTimeout(next,k==sc.length?7000:4500)};
$('sk').onclick=fin;next()}
function title(){$('p').innerHTML='';$('nm').textContent='';$('tx').textContent='';scr(`<h1>💧 맑은마을 이야기</h1><p>SDG 6 · 깨끗한 물과 위생 미연시 (약 10분)<br>4주 동안 물환경센터 동료 5명과 시간을 보내고, 로맨스 미니게임으로 호감도를 올려 보세요. 호감도 ♥6 이상이어야 결혼 엔딩!</p><p><input id="nn" placeholder="이름 입력" maxlength="8"> <button onclick="go()">시작</button></p><div class="g">${H.map((c,i)=>`<div class="card">${pt(i)}<br><b>${c.n}</b> (${c.age})<br>${c.job}</div>`).join('')}</div>`)}
function go(){S={n:$('nn').value||'신입',a:[0,0,0,0,0],m:[0,0,0,0,0],t:0,l:0,e:{}};
play([{h:-1,t:'물 문제로 고민이 많던 산골 마을, ‘맑은마을’. 오늘 당신은 이곳 물환경센터의 신입 직원으로 부임했다.'},{h:-1,t:'유엔 지속가능발전목표(SDG) 6번, “모두를 위한 깨끗한 물과 위생”. 이 마을은 그 시범 지역이다.'},{h:-1,t:'센터에는 개성 넘치는 다섯 명의 동료가 있다. 이름은 '+S.n+'. 앞으로 4주, 누구와 시간을 보낼지 선택하자.'},{h:-1,t:'두근두근 미니게임에 성공하면 마음의 거리가 가까워진다. 물 이야기에도 귀 기울여 보자!'}],menu)}
title();
</script></body></html>
